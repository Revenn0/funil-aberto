name: Ideia ou peça que falta
description: Algo que a sua operação precisa e o funil-aberto ainda não faz
labels: [ideia]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema da operação isto resolve
      description: O que você faz hoje (e com qual ferramenta paga) que queria fazer aqui.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como imagina
      description: Se for algo da lista "O que ainda não tem" do AGENTS.md, diga qual número.
  - type: checkboxes
    id: fazer
    attributes:
      label: Quer implementar?
      options:
        - label: Quero mandar o PR (comente aqui antes, para ninguém fazer em dobro)
