name: Defeito
description: Algo que deveria funcionar e não funciona
labels: [defeito]
body:
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      description: Os passos, a URL (sem token) e o que você esperava ver.
    validations:
      required: true
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
      description: Mensagem de erro, print ou trecho de log. Não cole token, senha nem dado de cliente.
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      description: O commit ou a data em que baixou, e a versão do Python.
