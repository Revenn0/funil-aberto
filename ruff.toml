# Lint do funil-aberto: o mesmo comando local e no CI (`ruff check .`).
line-length = 160
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "DTZ", "RUF"]
ignore = []

[lint.per-file-ignores]
"tests/*" = ["S"]
# Moldes de HTML: quebrar a linha do markup piora a leitura sem ganhar nada.
"paginas.py" = ["E501"]
